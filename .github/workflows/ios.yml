name: iOS

# Builds the app, runs it in the iPhone simulator through the main flow,
# and saves a screenshot of every step (download them from the run's "Artifacts").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Rules engine tests
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  simulator:
    name: Build and run in iPhone simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in runtimes for d in devices[k] if d['name'].startswith('iPhone')))
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run the walkthrough in the simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project NextUp.xcodeproj \
            -scheme NextUp \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath build/Walkthrough.xcresult \
            | tee build.log | grep -E "error:|warning: unre|Test Case|Test Suite|BUILD|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Screen check on the smallest iPhone
        if: success()
        run: |
          SMALL=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          for k in runtimes:
              for name in ('iPhone SE', 'iPhone 16e', 'iPhone 13 mini', 'iPhone 12 mini'):
                  for d in devices[k]:
                      if d['name'].startswith(name):
                          print(d['udid']); sys.exit()
          ")
          if [ -z "$SMALL" ]; then echo "No small iPhone simulator available"; exit 0; fi
          xcrun simctl list devices available | grep "$SMALL"
          xcodebuild test \
            -project NextUp.xcodeproj \
            -scheme NextUp \
            -destination "platform=iOS Simulator,id=$SMALL" \
            -only-testing:NextUpUITests/WalkthroughTests/testScreenPolish \
            -resultBundlePath build/Small.xcresult \
            | tee small.log | grep -E "error:|Test Case|\*\* TEST" || true

      - name: Show errors if it failed
        if: failure()
        run: grep -E "error:|failed|Fatal" build.log | head -80 || tail -80 build.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path build/Walkthrough.xcresult --output-path screenshots || true
          if [ -d build/Small.xcresult ]; then
            mkdir -p screenshots/small-iphone
            xcrun xcresulttool export attachments --path build/Small.xcresult --output-path screenshots/small-iphone || true
          fi
          ls -la screenshots || true

      - name: Print small copies of the screen-check shots
        if: always()
        # Small JPEGs as text in the log, for reviewers who can read logs but not download artifacts.
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          for folder, tag in (("screenshots", "main"), ("screenshots/small-iphone", "small")):
              manifest = os.path.join(folder, "manifest.json")
              if not os.path.exists(manifest):
                  continue
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", "")
                      if not name.startswith(("5", "6", "7", "01-", "02-", "04-", "17a")):
                          continue
                      src = os.path.join(folder, a["exportedFileName"])
                      out = "/tmp/shot.jpg"
                      subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "55",
                                      "-Z", "760", src, "--out", out], capture_output=True)
                      data = base64.b64encode(open(out, "rb").read()).decode()
                      print(f"SHOT {tag}/{name} {data}")
          PY

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-walkthrough
          path: |
            screenshots
            build.log
            small.log
